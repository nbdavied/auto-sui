# auto-sui 反向代理配置 —— 放在【另一台】带域名证书的 Nginx 服务器上
#
# 本机(后端 VM)只跑 uvicorn(http://0.0.0.0:8000), 不装 Nginx。
# 这份配置装在那台有域名的 nginx 上, 把流量反代到后端 VM。
#
# 使用前替换两个占位符:
#   __DOMAIN__       -> 你的域名, 如 autosui.example.com
#   __BACKEND_ADDR__ -> 后端 VM 的 http 地址, 如 http://10.0.0.5:8000
# 证书由该 nginx 服务器上的 certbot 通过 webroot 方式签发, 路径为 Let's Encrypt 默认位置。

server {
    listen 80;
    server_name __DOMAIN__;

    # Let's Encrypt HTTP-01 挑战目录, certbot 签发时需要外网能访问 80 端口
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # 其余 80 流量全部跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 上传的 xlsx 账单可能不小, 放宽体积限制
    client_max_body_size 20m;

    # 后端是另一台 VM 上的 uvicorn(HTTP, 无 TLS), 由本机 nginx 做 TLS 终止后转发
    location / {
        proxy_pass __BACKEND_ADDR__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
